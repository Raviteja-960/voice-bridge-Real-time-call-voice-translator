
# ── VoiceBridge AI - Docker Compose ──────────────────────────────────────────
# Services: nginx | frontend | backend | mongodb
# Usage:
#   Development : docker compose up --build
#   Production  : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: voicebridge-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: voicebridge
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "27017:27017"   # expose for local dev tools (Compass, etc.)
    networks:
      - voicebridge-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: voicebridge-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: INFO
    volumes:
      - ./backend:/app          # hot-reload in dev
      - ai_models:/root/.cache  # cache Whisper / TTS models
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - voicebridge-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── React Frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    container_name: voicebridge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - voicebridge-net

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: voicebridge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"   # TLS termination added in Module 9
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - voicebridge-net

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mongodb_data:
    driver: local
  ai_models:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  voicebridge-net:
    driver: bridge
